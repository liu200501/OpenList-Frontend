name: Test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-check:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.20.0"
          registry-url: "https://registry.npmjs.org"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      # build.sh 内部会跑 pnpm install + i18n + vite build
      - name: Build
        run: |
          chmod +x build.sh
          ./build.sh --dev --no-compress --skip-i18n

      # vite build 只做转译，不做类型检查，这里补一次 tsc
      - name: Type check
        run: pnpm lint
