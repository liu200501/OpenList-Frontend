name: Build and Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      version:
        description: "Target version (e.g. 1.0.0), tag will be v<version>"
        required: true
        type: string
      tag:
        description: "Release tag name (leave empty to use v<version>)"
        required: false
        type: string
      title:
        description: "Release title (leave empty to use 'Release <tag>')"
        required: false
        type: string
      description:
        description: "Release description / notes (leave empty to auto-generate)"
        required: false
        type: string
      draft:
        description: "Create as draft release"
        required: false
        type: boolean
        default: false
      prerelease:
        description: "Mark as prerelease"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.20.0"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      # ============ workflow_dispatch 时：同步版本、提交、打标签 ============
      - name: Prepare version and tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -e
          VERSION="${{ github.event.inputs.version }}"
          RELEASE_TAG="${{ github.event.inputs.tag }}"
          if [ -z "$RELEASE_TAG" ]; then
            RELEASE_TAG="v$VERSION"
          fi
          echo "Preparing release $RELEASE_TAG"

          # 配置 git 身份（不依赖任何 Secret）
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 同步 package.json 版本
          jq --arg v "$VERSION" '.version = $v' package.json > package.json.tmp
          mv package.json.tmp package.json
          git add package.json
          git commit -m "chore: release $RELEASE_TAG" --no-verify || echo "No changes to commit"

          # 删除旧的 edge 标签，避免干扰 git describe
          git tag -d edge 2>/dev/null || true

          # 打上正式版本标签
          git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG" -f

          # 推送提交和标签回仓库（Release 创建时需要用到标签）
          git push origin HEAD:${{ github.ref_name }} || git push origin HEAD
          git push origin "$RELEASE_TAG" -f

      # ============ 统一拿到本次构建用的标签 ============
      - name: Determine tag
        id: release_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RELEASE_TAG="${{ github.event.inputs.tag }}"
            if [ -z "$RELEASE_TAG" ]; then
              RELEASE_TAG="v${{ github.event.inputs.version }}"
            fi
            echo "tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      # ============ 构建 regular 版本 ============
      - name: Build Release
        run: |
          chmod +x build.sh
          ./build.sh --release --compress
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

      - name: Move regular build
        run: |
          mkdir -p regular-dist
          mv dist/* regular-dist/

      # ============ 构建 lite 版本 ============
      - name: Build Lite Release
        run: |
          chmod +x build.sh
          ./build.sh --release --compress --lite
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

      - name: Move lite build and restore regular build
        run: |
          mkdir -p lite-dist
          mv dist/* lite-dist/
          mv regular-dist/* dist/

      # ============ 创建 Release 并上传产物 ============
      - name: Create Release
        run: |
          TAG="${{ steps.release_tag.outputs.tag }}"
          TITLE="${{ github.event.inputs.title }}"
          DESCRIPTION="${{ github.event.inputs.description }}"
          DRAFT="${{ github.event.inputs.draft }}"
          PRERELEASE="${{ github.event.inputs.prerelease }}"

          if [ -z "$TITLE" ]; then
            TITLE="Release $TAG"
          fi

          ARGS=(--title "$TITLE")

          if [ -n "$DESCRIPTION" ]; then
            ARGS+=(--notes "$DESCRIPTION")
          else
            ARGS+=(--generate-notes)
          fi

          if [ "$DRAFT" = "true" ]; then
            ARGS+=(--draft)
          fi

          if [ "$PRERELEASE" = "true" ]; then
            ARGS+=(--prerelease)
          fi

          gh release create "$TAG" \
            "${ARGS[@]}" \
            dist/openlist-frontend-dist-v*.tar.gz \
            lite-dist/openlist-frontend-dist-lite-v*.tar.gz \
            dist/i18n.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
